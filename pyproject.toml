[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-component-inspector"
version = "1.1.0"
description = "YOLO-based PCB component detection, counting and report export system"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "PYB"}]
dependencies = [
  "ultralytics>=8.3.0,<9",
  "opencv-python>=4.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.4",
  "streamlit>=1.38",
  "streamlit-webrtc>=0.77,<1",
  "av>=15.1,<18",
  "huggingface-hub>=0.27",
  "PyYAML>=6.0",
]

[project.scripts]
pcb-inspect = "pcb_inspector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
