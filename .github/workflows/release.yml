name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Compile
        run: python -m compileall src app.py scripts tests

      - name: Tests
        run: pytest -q

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Compile FPGA RTL
        run: |
          iverilog -g2012 -Wall -s pcb_preprocess_top -o /tmp/pcb_preprocess.vvp fpga/rtl/*.v
          iverilog -g2012 -Wall -s pcb_preprocess_regs -o /tmp/pcb_regs.vvp fpga/rtl/*.v

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "PCB Component Inspector ${GITHUB_REF_NAME}"
