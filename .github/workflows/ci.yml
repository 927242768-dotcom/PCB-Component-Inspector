name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Compile
        run: python -m compileall src app.py scripts tests

      - name: Tests
        run: pytest -q

  rtl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile FPGA RTL
        run: |
          iverilog -g2012 -Wall -s pcb_preprocess_top -o /tmp/pcb_preprocess.vvp fpga/rtl/*.v
          iverilog -g2012 -Wall -s pcb_preprocess_regs -o /tmp/pcb_regs.vvp fpga/rtl/*.v
